<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>電子カレンダー手帳</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>📖 電子カレンダー手帳</h1>
        <p>予定と思い出を記録しよう</p>
    </header>

    <div class="calendar">

        <!-- 月の切り替え -->
        <div style="display:flex; justify-content:center; align-items:center; gap:20px;">
            <button type="button" onclick="changeMonth(-1)">← 前月</button>

            <h2 id="monthTitle"></h2>

            <button type="button" onclick="changeMonth(1)">次月 →</button>
        </div>

        <!-- カレンダー -->
        <table>
            <thead>
                <tr>
                    <th>日</th>
                    <th>月</th>
                    <th>火</th>
                    <th>水</th>
                    <th>木</th>
                    <th>金</th>
                    <th>土</th>
                </tr>
            </thead>

            <tbody id="calendarBody">
            </tbody>
        </table>


        <!-- 共有予定 -->
        <div class="event-form">

            <h3>📅 共有予定を追加</h3>

            <input type="date" id="eventDate">

            <input
                type="text"
                id="eventTitle"
                placeholder="予定を入力してください"
            >

            <button type="button" onclick="addEvent()">
                予定を追加
            </button>

        </div>


        <!-- ===== 友達と共有機能 ===== -->

        <div class="share-section">

            <h3>👥 友達と共有</h3>

            <div class="share-input-area">

                <label for="friendName">友達の名前：</label>

                <input
                    type="text"
                    id="friendName"
                    placeholder="例：田中さん"
                    class="share-input"
                >

                <label for="shareMemo">共有する内容：</label>

                <textarea
                    id="shareMemo"
                    rows="3"
                    placeholder="共有する内容を入力してください"
                    class="share-textarea"
                ></textarea>

                <button
                    type="button"
                    onclick="saveSharedData()"
                    class="share-btn"
                >
                    💾 共有する
                </button>

            </div>

            <div id="sharedList" class="shared-list">

                <h4>📋 共有履歴</h4>

                <ul id="sharedItems"></ul>

            </div>

        </div>

        <!-- ===== ここまで ===== -->

    </div>


<script>

    // ==========================================
    // カレンダー
    // ==========================================

    const today = new Date();

    // 最初に現在の年月を表示
    let currentYear = today.getFullYear();
    let currentMonth = today.getMonth();

    let savedEvents = [];


    function formatDate(year, month, day) {

        const monthText = String(month + 1).padStart(2, "0");
        const dayText = String(day).padStart(2, "0");

        return `${year}-${monthText}-${dayText}`;
    }


    function renderCalendar() {

        const monthTitle = document.getElementById("monthTitle");
        const calendarBody = document.getElementById("calendarBody");

        monthTitle.textContent =
            `${currentYear}年${currentMonth + 1}月`;

        calendarBody.innerHTML = "";

        // 月の1日
        const firstDay =
            new Date(currentYear, currentMonth, 1).getDay();

        // 月の最終日
        const daysInMonth =
            new Date(currentYear, currentMonth + 1, 0).getDate();


        let day = 1;

        // 最大6週間
        for (let week = 0; week < 6; week++) {

            const row = document.createElement("tr");

            for (let weekday = 0; weekday < 7; weekday++) {

                const cell = document.createElement("td");

                if (
                    (week === 0 && weekday < firstDay) ||
                    day > daysInMonth
                ) {

                    cell.innerHTML = "";

                } else {

                    const dateString =
                        formatDate(currentYear, currentMonth, day);

                    const link = document.createElement("a");

                    link.href =
                        `diary.html?date=${dateString}`;

                    link.setAttribute("data-day", day);

                    link.textContent = day;


                    // 今日をハイライト
                    if (
                        currentYear === today.getFullYear() &&
                        currentMonth === today.getMonth() &&
                        day === today.getDate()
                    ) {

                        cell.classList.add("today");
                    }


                    // この日の共有予定を表示
                    const dayEvents = savedEvents.filter(
                        event => event.date === dateString
                    );

                    dayEvents.forEach(event => {

                        const eventText =
                            document.createElement("div");

                        

                        eventText.textContent = event.title + " 🗑️";

eventText.style.fontSize = "12px";
eventText.style.marginTop = "5px";
eventText.style.color = "#c45b82";
eventText.style.cursor = "pointer";

eventText.onclick = function(eventClick) {

    // 点击予定时，不进入日记页面
    eventClick.preventDefault();
    eventClick.stopPropagation();

    deleteEvent(event.id, event.title);
};

link.appendChild(eventText);
                    });


                    cell.appendChild(link);

                    day++;
                }

                row.appendChild(cell);
            }

            calendarBody.appendChild(row);

            if (day > daysInMonth) {
                break;
            }
        }
    }


    // 前月・次月
    function changeMonth(amount) {

        currentMonth += amount;

        if (currentMonth < 0) {

            currentMonth = 11;
            currentYear--;

        } else if (currentMonth > 11) {

            currentMonth = 0;
            currentYear++;
        }

        renderCalendar();
    }



    // ==========================================
    // 友達と共有（LocalStorage）
    // ==========================================

    function saveSharedData() {

        const friendName =
            document.getElementById("friendName").value.trim();

        const shareMemo =
            document.getElementById("shareMemo").value.trim();


        if (!friendName || !shareMemo) {

            alert(
                "⚠️ 友達の名前と共有内容を両方入力してください"
            );

            return;
        }


        let sharedData =
            JSON.parse(localStorage.getItem("sharedData")) || [];


        const newData = {

            id: Date.now(),

            friendName: friendName,

            shareMemo: shareMemo,

            date: new Date().toLocaleString("ja-JP"),

            timestamp: new Date().getTime()
        };


        sharedData.unshift(newData);

        localStorage.setItem(
            "sharedData",
            JSON.stringify(sharedData)
        );


        displaySharedData();


        document.getElementById("friendName").value = "";

        document.getElementById("shareMemo").value = "";


        alert("✅ 共有内容を保存しました！");
    }



    function displaySharedData() {

        const sharedData =
            JSON.parse(localStorage.getItem("sharedData")) || [];

        const listElement =
            document.getElementById("sharedItems");


        if (sharedData.length === 0) {

            listElement.innerHTML =
                '<li style="color:#999; list-style:none;">共有履歴はありません</li>';

            return;
        }


        listElement.innerHTML =
            sharedData.map(item => `

                <li class="shared-item">

                    <strong>
                        👤 ${item.friendName}
                    </strong>

                    <span class="shared-date">
                        ${item.date}
                    </span>

                    <p class="shared-memo">
                        ${item.shareMemo}
                    </p>

                    <button
                        onclick="deleteSharedData(${item.id})"
                        class="delete-btn"
                    >
                        🗑️ 削除
                    </button>

                </li>

            `).join("");
    }



    function deleteSharedData(id) {

        if (!confirm("この共有内容を削除しますか？")) {
            return;
        }


        let sharedData =
            JSON.parse(localStorage.getItem("sharedData")) || [];


        sharedData =
            sharedData.filter(item => item.id !== id);


        localStorage.setItem(
            "sharedData",
            JSON.stringify(sharedData)
        );


        displaySharedData();
    }



    // ==========================================
    // 共有予定をサーバーに保存
    // ==========================================

    async function addEvent() {

        const date =
            document.getElementById("eventDate").value;

        const title =
            document.getElementById("eventTitle").value.trim();


        if (!date || !title) {

            alert("日付と予定を入力してください");

            return;
        }


        const newEvent = {

            date: date,

            title: title
        };


        try {

            const response =
                await fetch("/api/events", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify(newEvent)
                });


            if (!response.ok) {

                throw new Error("保存に失敗しました");
            }


            alert("予定を保存しました！");


            document.getElementById("eventDate").value = "";

            document.getElementById("eventTitle").value = "";


            // 保存後に最新予定を読み込む
            await loadEvents();


        } catch (error) {

            alert("エラーが発生しました");

            console.error(error);
        }
    }



    // ==========================================
    // サーバーから共有予定を読み込む
    // ==========================================
// ==========================================
// 共有予定を削除
// ==========================================

async function deleteEvent(id, title) {

    const result = confirm(
        `「${title}」を削除しますか？`
    );

    if (!result) {
        return;
    }

    try {

        const response = await fetch(`/api/events/${id}`, {
            method: "DELETE"
        });

        if (!response.ok) {
            throw new Error("削除に失敗しました");
        }

        alert("予定を削除しました！");

        // 削除後、最新の予定を再読み込み
        await loadEvents();

    } catch (error) {

        alert("予定の削除中にエラーが発生しました");

        console.error(error);
    }
}
    async function loadEvents() {

        try {

            const response =
                await fetch("/api/events");


            if (!response.ok) {

                throw new Error(
                    "予定の読み込みに失敗しました"
                );
            }


            savedEvents = await response.json();


            console.log(
                "保存されている予定：",
                savedEvents
            );


            renderCalendar();


        } catch (error) {

            console.error(error);

            // 予定取得に失敗してもカレンダーは表示
            renderCalendar();
        }
    }



    // ==========================================
    // ページ読み込み
    // ==========================================

    document.addEventListener(
        "DOMContentLoaded",
        () => {

            displaySharedData();

            renderCalendar();

            loadEvents();
        }
    );

</script>

</body>

</html>
