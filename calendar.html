        <div class="event-form">
    <h3>📅 共有予定を追加</h3>

    <input type="date" id="eventDate">

    <input type="text" id="eventTitle" placeholder="予定を入力してください">

    <button type="button" onclick="addEvent()">予定を追加</button>

        <!-- ===== 友達と共有機能 ===== --> 
        <div class="share-section"> 

            <h3>👥 友達と共有</h3>
            <div class="share-input-area"> 

                <label for="friendName">友達の名前：</label> 
                <input 
                    type="text" 
                    id="friendName" 
                    placeholder="例：田中さん" 
                    class="share-input"
                > 
                 
                <label for="shareMemo">共有する内容：</label> 

                <textarea 
                    id="shareMemo" 
                    rows="3" 
                    placeholder="共有する内容を入力してください" 
                    class="share-textarea"
                ></textarea> 
                 
                <button 
                    onclick="saveSharedData()" 
                    class="share-btn"
                >
                    💾 共有する
                </button> 

            </div> 
             
            <!-- 保存した共有データを表示 --> 
            <div id="sharedList" class="shared-list"> 

                <h4>📋 共有履歴</h4> 

                <ul id="sharedItems"></ul> 

            </div> 

        </div> 
        <!-- ===== ここまで ===== --> 

    </div> 

    <script> 

        // 自動で今日の日付をハイライト 
        const today = new Date(); 
        const todayDay = today.getDate(); 

        const links = document.querySelectorAll('td a[data-day]'); 

        links.forEach(link => { 
            const day = parseInt(link.getAttribute('data-day')); 

            if (day === todayDay) { 
                link.parentElement.classList.add('today'); 
            } 
        }); 


        // ===== 友達と共有 (LocalStorage保存) ===== 
        function saveSharedData() { 

            const friendName = document.getElementById('friendName').value.trim(); 
            const shareMemo = document.getElementById('shareMemo').value.trim(); 

            if (!friendName || !shareMemo) { 
                alert('⚠️ 友達の名前と共有内容を両方入力してください'); 
                return; 
            } 

            // LocalStorageから既存データを取得 
            let sharedData = JSON.parse(localStorage.getItem('sharedData')) || []; 

            // 新しいデータを作成 
            const newData = { 
                id: Date.now(), 
                friendName: friendName, 
                shareMemo: shareMemo, 
                date: new Date().toLocaleString('ja-JP'), 
                timestamp: new Date().getTime() 
            }; 

            // 追加 
            sharedData.unshift(newData); 

            // LocalStorageに保存 
            localStorage.setItem('sharedData', JSON.stringify(sharedData)); 

            // 表示を更新 
            displaySharedData(); 

            // 入力フィールドをクリア 
            document.getElementById('friendName').value = ''; 
            document.getElementById('shareMemo').value = ''; 

            alert('✅ 共有内容を保存しました！'); 
        } 


        function displaySharedData() { 

            const sharedData = JSON.parse(localStorage.getItem('sharedData')) || []; 
            const listElement = document.getElementById('sharedItems'); 

            if (sharedData.length === 0) { 

                listElement.innerHTML = 
                    '<li style="color:#999; list-style:none;">共有履歴はありません</li>'; 

                return; 
            } 

            listElement.innerHTML = sharedData.map(item => ` 
                <li class="shared-item"> 
                    <strong>👤 ${item.friendName}</strong> 
                    <span class="shared-date">${item.date}</span> 
                    <p class="shared-memo">${item.shareMemo}</p> 
                    <button 
                        onclick="deleteSharedData(${item.id})" 
                        class="delete-btn"
                    >
                        🗑️ 削除
                    </button> 
                </li> 
            `).join(''); 
        } 


        function deleteSharedData(id) { 

            if (!confirm('この共有内容を削除しますか？')) return; 

            let sharedData = JSON.parse(localStorage.getItem('sharedData')) || []; 

            sharedData = sharedData.filter(item => item.id !== id); 

            localStorage.setItem('sharedData', JSON.stringify(sharedData)); 

            displaySharedData(); 
        } 


        // ページ読み込み時に表示 
        document.addEventListener('DOMContentLoaded', displaySharedData); 

    // ===== 共有予定をサーバーに保存 =====
async function addEvent() {

    const date = document.getElementById("eventDate").value;
    const title = document.getElementById("eventTitle").value.trim();

    if (!date || !title) {
        alert("日付と予定を入力してください");
        return;
    }

    const newEvent = {
        date: date,
        title: title
    };

    try {
        const response = await fetch("/api/events", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(newEvent)
        });

        if (!response.ok) {
            throw new Error("保存に失敗しました");
        }

        alert("予定を保存しました！");

        document.getElementById("eventDate").value = "";
        document.getElementById("eventTitle").value = "";

    } catch (error) {
        alert("エラーが発生しました");
        console.error(error);
    }
}

// ===== サーバーから共有予定を読み込む =====
async function loadEvents() {
    try {
        const response = await fetch("/api/events");

        if (!response.ok) {
            throw new Error("予定の読み込みに失敗しました");
        }

        const events = await response.json();

        console.log("保存されている予定：", events);
        events.forEach(event => {
    const eventDate = new Date(event.date + "T00:00:00");

    // 这个页面目前是 2026年7月，所以只显示 2026年7月的予定
    if (eventDate.getFullYear() === 2026 && eventDate.getMonth() === 6) {

        const day = eventDate.getDate();

        const dayLink = document.querySelector(
            `td a[data-day="${day}"]`
        );

        if (dayLink) {
            const eventText = document.createElement("div");

            eventText.textContent = event.title;
            eventText.style.fontSize = "12px";
            eventText.style.marginTop = "5px";
            eventText.style.color = "#c45b82";

            dayLink.appendChild(eventText);
        }
    }
});

    } catch (error) {
        console.error(error);
    }
}

// ページを開いた時に予定を読み込む
loadEvents();
</script>
